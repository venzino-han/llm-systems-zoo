name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core + dev (CPU torch + transformers for the minimal implementations)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.45"  # tiny random-init models for the L05 training tests
      - name: Lint
        run: ruff check .
      - name: CPU tests (simulators, calculators, metrics, minimal implementations)
        run: pytest -q
