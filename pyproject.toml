[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-systems-zoo"
version = "0.1.0"
description = "Reproducible experiments across LLM training, inference, serving, and distributed systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kirc" }]
keywords = ["llm", "inference", "serving", "kv-cache", "distributed-training", "ray", "vllm", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies are deliberately light: the simulators, calculators, metrics and
# analysis code must run on a CPU-only CI runner without downloading torch.
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "rich>=13.0",
]

[project.optional-dependencies]
# Heavy, track-specific dependencies are isolated as extras. Install only what a lab needs.
torch = ["torch>=2.4"]
inference = ["torch>=2.4", "transformers>=4.45", "vllm>=0.6", "bitsandbytes>=0.43", "datasets>=2.20", "openai>=1.40", "httpx>=0.27"]
training = ["torch>=2.4", "transformers>=4.45", "datasets>=2.20", "accelerate>=0.34", "peft>=0.12", "trl>=0.12"]
ray = ["ray[default,data,train,serve]>=2.30", "torch>=2.4", "transformers>=4.45"]
apps = ["torch>=2.4", "transformers>=4.45", "sentence-transformers>=3.0", "faiss-cpu>=1.8", "datasets>=2.20", "openai>=1.40"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/venzino-han/llm-systems-zoo"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "llm_systems_zoo*", "fundamentals*", "inference*", "serving*", "training*",
  "post_training*", "distributed*", "applications*", "benchmarks*",
]
exclude = ["tests*", "runs*", "reports*", "docs*", "docker*", "configs*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "runs", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP007", "UP006", "UP035", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["llm_systems_zoo", "fundamentals", "inference", "serving", "training", "post_training", "distributed", "applications", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --timeout=900"
markers = [
  "gpu: requires a CUDA GPU (run with --gpu)",
  "slow: slow test or one that downloads models/datasets (run with --slow)",
]
filterwarnings = ["ignore::DeprecationWarning"]
