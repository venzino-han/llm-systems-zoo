# Same as baseline but the scheduler may only run 8 sequences per step: shows how batch width
# trades per-request latency (TPOT) for throughput.
label: max_num_seqs_8
model: Qwen/Qwen2.5-0.5B-Instruct
port: 8000
gpu_memory_utilization: 0.30
max_model_len: 4096
max_num_seqs: 8
max_num_batched_tokens: 8192
enable_chunked_prefill: true
enable_prefix_caching: true
enforce_eager: false
