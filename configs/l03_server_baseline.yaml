# vLLM defaults for the model: wide batch, chunked prefill on, prefix caching on (vLLM V1 defaults).
label: baseline
model: Qwen/Qwen2.5-0.5B-Instruct
port: 8000
gpu_memory_utilization: 0.30
max_model_len: 4096
max_num_seqs: 256
max_num_batched_tokens: 8192
enable_chunked_prefill: true
enable_prefix_caching: true
enforce_eager: false
