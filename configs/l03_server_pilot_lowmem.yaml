# Pilot config used on a *shared* GPU (RTX A6000, ~16 GB free): 10% of the device, eager mode,
# 2k context. Capacity-limited by the small KV cache; numbers are "pilot, shared GPU, 0.10 util".
# Scheduler settings are identical to l03_server_baseline.yaml.
label: baseline
model: Qwen/Qwen2.5-0.5B-Instruct
port: 8010
gpu_memory_utilization: 0.10
max_model_len: 2048
max_num_seqs: 256
max_num_batched_tokens: 8192
enable_chunked_prefill: true
enable_prefix_caching: true
enforce_eager: true
env:
  CUDA_DEVICE_ORDER: PCI_BUS_ID
  CUDA_VISIBLE_DEVICES: "0"
